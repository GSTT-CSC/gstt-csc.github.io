---
layout: default
---
{% include nav.html %}

{% if page.background == "grey" or page.background == "gray" %}
<script>
document.getElementById("page-top").className="bg-light";
</script>
{% endif %}

<style>
.dropcap {
  float: left;
  font-size: 3.5em;
  line-height: 0.8;
  padding-top: 0.05em;
  padding-right: 0.08em;
  padding-left: 0.05em;
  font-weight: bold;
}
</style>

<div class="container" id="pagecontainer">
    <br>
    <div class="row">
        <div class="col-12 col-md-4 text-center pb-3">
            <img class="mx-auto rounded-circle p-1" style="width: 150px;" src={{ page.author-image }} alt="">
		    <h4 class="pt-2 text-center">{{ page.author }}</h4>
            <h5 class="pt-2 text-center">{{page.author-role}}</h5>

        </div>
        <div class="col-12 col-md-8">
            <img class="mx-auto img-fluid" style="width: 760px;" src={{ page.image }} alt="">
            <h1>{{page.title}}</h1>
            <p>{{ page.date | date: "%-d %B %Y" }}</p>
            <br>
            {{ content }}
        </div>
    </div>
</div>
